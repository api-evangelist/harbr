aid: harbr
name: Harbr
description: >-
  Harbr is a white-label external data-sharing, exchange, and marketplace
  platform that lets organizations reveal, build, and manage a data ecosystem
  for external collaboration and commercial data distribution. The platform
  provides data discovery and cataloging, subscription-based access governance,
  secure data delivery to external environments and AI systems, and audit
  trails for compliance. It deploys across AWS, Azure, Google Cloud, and
  Databricks, and connects to Snowflake, BigQuery, Databricks, Looker, and
  Power BI. Harbr exposes REST APIs and event-driven webhooks for automating
  data exchanges, though the technical API reference is published in an
  invite-only Operator Documentation portal. Harbr is backed by Seedcamp.
